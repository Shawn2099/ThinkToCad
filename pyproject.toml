[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thinktocad"
version = "0.1.0"
description = "Knowledge-Guided Agentic Design Toolkit: skill + MCP servers + validators for mechanical CAD."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ThinkToCad contributors" }]
keywords = ["cad", "mcp", "agent", "build123d", "freecad", "knowledge-guided"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: CAD",
]
dependencies = [
    "pyyaml>=6.0",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
cad = ["build123d>=0.7", "cadquery>=2.4"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
thinktocad-install-skill = "thinktocad.scripts.install_skill:main"
thinktocad-mcp = "thinktocad.mcp.server:main"
# NOTE: do NOT declare build123d-mcp / freecad-mcp / matlab-mcp here. Those console
# scripts belong to the external MCP servers (pzfreo/build123d-mcp, neka-nat/freecad-mcp,
# MathWorks/matlab-mcp-server). Declaring them would collide/shadow those installs.
# ThinkToCad orchestrates them; its own entry point is `thinktocad-mcp` (added in Phase 1).

[tool.setuptools]
packages = ["thinktocad", "thinktocad.runtime", "thinktocad.mcp", "thinktocad.tools", "thinktocad.scripts"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.md", "*.yaml", "*.yml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
